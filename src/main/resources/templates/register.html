<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | SkyReserve</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><main class="auth-card"><a class="brand dark" href="/">✈ SkyReserve</a><span class="eyebrow">PASSENGER ACCOUNT</span><h1>Create your account</h1><p th:if="${error}" class="alert error" th:text="${error}"></p><form method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Full Name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Phone</label><input name="phone"><label>Password</label><input type="password" name="password" minlength="6" required><button class="btn primary full">Create Account</button></form><p>Already registered? <a href="/login">Sign in</a></p></main></body></html>
