<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="nav" class="nav">
  <div class="brand"><span class="plane">✈</span> SkyReserve</div>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/bookings" sec:authorize="isAuthenticated()">My Bookings</a>
    <a href="/admin" sec:authorize="hasRole('ADMIN')">Admin</a>
    <a href="/login" sec:authorize="!isAuthenticated()" class="nav-cta">Login</a>
    <a href="/register" sec:authorize="!isAuthenticated()" class="nav-signup">Sign up</a>
    <form method="post" action="/logout" class="inline-form" sec:authorize="isAuthenticated()">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="nav-button">Logout</button>
    </form>
  </div>
</div>
</body>
</html>
