<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Bookings | SkyReserve</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container">
<div class="page-title"><span class="eyebrow">TRAVEL MANAGEMENT</span><h1>My Bookings</h1><p>View your reservations, download tickets and cancel upcoming journeys.</p></div>
<div th:if="${#lists.isEmpty(bookings)}" class="card empty-state"><h2>No bookings yet</h2><p>Search for a flight to make your first reservation.</p><a class="btn primary" href="/">Search Flights</a></div>
<div class="table-wrap" th:if="${!#lists.isEmpty(bookings)}"><table class="table"><thead><tr><th>Reference</th><th>Flight</th><th>Date</th><th>Seat</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="b:${bookings}"><td><a th:href="@{/bookings/{ref}(ref=${b.bookingReference})}" th:text="${b.bookingReference}"></a></td><td th:text="${b.schedule.flight.flightNumber}"></td><td th:text="${b.schedule.travelDate}"></td><td><span class="pill" th:text="${b.seatNumber}"></span></td><td th:text="${'₹' + #numbers.formatDecimal(b.amount,1,2)}"></td><td><span class="status" th:classappend="${b.status.name() == 'CONFIRMED'} ? ' confirmed' : ' cancelled'" th:text="${b.status}"></span></td><td class="actions"><a class="btn small-btn secondary" th:href="@{/bookings/{ref}/pdf(ref=${b.bookingReference})}">PDF</a><form th:if="${b.status.name()=='CONFIRMED'}" method="post" th:action="@{/bookings/{ref}/cancel(ref=${b.bookingReference})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger small-btn">Cancel</button></form></td></tr></tbody></table></div>
</main></body></html>
