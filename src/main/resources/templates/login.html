<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | SkyReserve</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><main class="auth-card"><a class="brand dark" href="/">✈ SkyReserve</a><span class="eyebrow">SECURE ACCESS</span><h1>Welcome back</h1><p class="muted">Sign in to continue your reservation.</p><p th:if="${param.error}" class="alert error">Invalid email or password.</p><p th:if="${param.registered}" class="alert success">Registration successful. Please sign in.</p><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Email</label><input type="email" name="username" required><label>Password</label><input type="password" name="password" required><button class="btn primary full">Login</button></form><p>New passenger? <a href="/register">Create an account</a></p><div class="demo-box">Demo user: <b>user@skyreserve.local</b> / <b>user123</b><br>Demo admin: <b>admin@skyreserve.local</b> / <b>admin123</b></div></main></body></html>
